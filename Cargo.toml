[package]
name = "bam2fastq"
version = "2.0.0"
authors = ["lishuangshuang3@mgi-tech.com"]
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_derive = "^1"
serde_bytes = "*"
shardio = "0.8.2"
rust-htslib = { version = "0.49.0", default-features = false }
regex = "1.10.0"
itertools = "0.14.0"
anyhow = "1"
gzp = { version = "0.11", default-features = false, features = ["deflate_zlib_ng"] }
docopt = "1.1.0"
backtrace = "0.3"
csv = "1.3.1"
tempfile = "3.16.0"
clap = {version = "4.5.0", features = ["derive"]}
indicatif = "0.17"
rayon = "1.5"
once_cell = "1.19"
num_cpus = "1"
rustc-hash = "2.1.1"

[profile.release]
opt-level = 3       # Optimize for speed
debug = 0           # Disable debug information
lto = true          # Fat LTO: slower link, best cross-crate inlining
codegen-units = 1   # Reduce parallel compilation units for better optimization
panic = 'abort'     # Remove panic unwinding code
strip = true        # Automatically strip symbol information

[profile.release.build-override]
opt-level = 3

[profile.dev]
opt-level = 3

[profile.test]
opt-level = 3
