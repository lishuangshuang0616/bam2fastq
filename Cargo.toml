[package]
name = "bam2fastq"
version = "1.0.0"
authors = ["lishuangshuang3@mgi-tech.com"]
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_derive = "^1"
serde_bytes = "*"
shardio = "0.8.2"
rust-htslib = { version = "0.49.0", default-features = false }
regex = "1.10.0"
itertools = "0.14.0"
anyhow = "1"
flate2 = "1.0.26"
docopt = "1.1.0"
backtrace = "0.3"
csv = "1.3.1"
tempfile = "3.16.0"
clap = {version = "4.5.0", features = ["derive"]}
indicatif = "0.17"

[profile.release]
opt-level = 'z'     # 优化大小而不是速度
debug = 0           # 禁用调试信息
lto = true         # 启用链接时优化
codegen-units = 1  # 降低并行编译单元数以提高优化
panic = 'abort'    # 移除 panic 展开代码
strip = true       # 自动剥离符号信息

[profile.dev]
opt-level = 3

[profile.test]
opt-level = 3